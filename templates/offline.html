{% load static i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16241f">
  <link rel="icon" href="{% static 'img/icons/icon-192.png' %}">
  <title>{% translate "You're offline" %} | FinTrack</title>
  <link rel="stylesheet" href="{% asset 'css/app.css' %}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--surface); font-family: var(--font-body); }
    .box { max-width: 22rem; text-align: center; }
    .logo { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 1rem; display: grid; place-items: center; background: var(--gold); color: #221a06; font: 700 2rem Georgia, serif; }
    h1 { font: 700 1.5rem/1.3 var(--font-display); color: var(--text-primary); }
    p { margin: 0.625rem 0 1.5rem; color: var(--text-secondary); line-height: 1.55; }
  </style>
</head>
<body>
  <main class="box">
    <div class="logo" aria-hidden="true">৳</div>
    <h1>{% translate "You're offline" %}</h1>
    <p>{% translate "FinTrack needs an internet connection to show your latest figures. Nothing you entered is lost — try again once you're back online." %}</p>
    <button type="button" class="btn btn-primary btn-lg" onclick="location.reload()">{% translate "Try again" %}</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
