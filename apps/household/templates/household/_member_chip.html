{% load i18n %}{# who paid, in their colour (m: a HouseholdMember) — a link to them, or plain=True inside a row that's a link already #}{% if plain %}<span class="member-chip" data-goal="{{ m.color }}"><span>{{ m.name }}</span></span>{% else %}<a href="{% url 'household_member_detail' m.pk %}" class="member-chip" data-goal="{{ m.color }}" title="{% blocktranslate with name=m.name %}Paid by {{ name }}{% endblocktranslate %}"><span>{{ m.name }}</span></a>{% endif %}
