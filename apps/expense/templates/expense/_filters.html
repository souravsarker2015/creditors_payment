{% load i18n %}
{% comment %}Shared by the expense dashboard and ledger. Optional: show_sort, show_export. Needs: reset_url.{% endcomment %}
<form method="get" class="card" x-data="{ open: false, filterMode: '{{ filter_mode|default:"include" }}' }">
  <input type="hidden" name="filter_mode" x-model="filterMode">
  <button type="button" class="collapse-toggle" @click="open = !open" :aria-expanded="open.toString()">
    <span class="flex items-center gap-2">
      <span class="h-[1.125rem] w-[1.125rem]" style="color: var(--text-muted);">{% include "partials/icon.html" with name="filter" %}</span>
      {% translate "Filters" %}
      {% if selected_category_ids or selected_year or date_from or date_to %}<span class="badge" data-tone="accent">{% translate "On" %}</span>{% endif %}
    </span>
    {% include "partials/icon.html" with name="chevron-down" %}
  </button>
  <div class="collapse-body border-t border-[var(--border-soft)] lg:border-t-0" :class="open && 'is-open'">
    <div class="card-body">
      <div class="form-grid form-grid-4">
        <div class="field">
          <span class="label">{% translate "Categories" %}</span>
          <div class="seg seg-block">
            <button type="button" class="seg-item" data-tone="accent" :class="filterMode === 'include' && 'is-active'" @click="filterMode = 'include'">{% translate "Include" %}</button>
            <button type="button" class="seg-item" data-tone="critical" :class="filterMode === 'exclude' && 'is-active'" @click="filterMode = 'exclude'">{% translate "Exclude" %}</button>
          </div>
        </div>
        <div class="field">
          <label for="category-filter" class="label">{% translate "Which categories" %}</label>
          <select id="category-filter" name="category" multiple class="form-input">
            {% for cat in available_categories %}
              <option value="{{ cat.id }}"{% if cat.id in selected_category_ids %} selected{% endif %}>{{ cat.name }}{% if not cat.is_active %} ({% translate "inactive" %}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="year-filter" class="label">{% translate "Year" %}</label>
          <select id="year-filter" name="year" class="form-input">
            <option value="">{% translate "All Years" %}</option>
            {% for yr in year_options %}<option value="{{ yr }}"{% if selected_year == yr %} selected{% endif %}>{{ yr }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="date-range-filter" class="label">{% translate "Date Range" %}</label>
          <input id="date-range-filter" type="text" placeholder="{% translate 'Select range...' %}" class="form-input" autocomplete="off">
          <input id="date-from-hidden" type="hidden" name="date_from" value="{{ date_from }}">
          <input id="date-to-hidden" type="hidden" name="date_to" value="{{ date_to }}">
        </div>
        {% if show_sort %}
        <div class="field">
          <label for="sort" class="label">{% translate "Sort by" %}</label>
          <select id="sort" name="sort" class="form-input">
            {% for value, label in sort_options %}<option value="{{ value }}"{% if value == sort %} selected{% endif %}>{{ label }}</option>{% endfor %}
          </select>
        </div>
        {% endif %}
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">{% translate "Apply Filters" %}</button>
        <a href="{{ reset_url }}" class="btn btn-ghost">{% translate "Reset" %}</a>
        {% if show_export %}
        <button type="submit" name="export" value="csv" class="btn btn-secondary sm:ml-auto">{% include "partials/icon.html" with name="download" %}{% translate "Export CSV" %}</button>
        {% endif %}
      </div>
    </div>
  </div>
</form>
