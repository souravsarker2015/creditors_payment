{% load i18n work %}<li class="wtf-item" data-file="{{ f.pk }}">
  <a href="{% url 'work:task_file' f.pk %}" class="wtf-thumb" target="_blank" rel="noopener"{% if not f.is_image %} download{% endif %}>{% if f.is_image %}<img src="{% url 'work:task_file' f.pk %}" alt="" loading="lazy">{% else %}<span class="wtf-ext">{{ f.ext|slice:"1:"|upper|default:"FILE" }}</span>{% endif %}</a>
  <div class="wtf-meta"><a href="{% url 'work:task_file' f.pk %}" target="_blank" rel="noopener" class="wtf-name"{% if not f.is_image %} download{% endif %}>{{ f.name }}</a><span>{{ f.size|filesizeformat }} · {{ f.created_at|date:"j M" }}</span></div>
  {% if f.is_image %}<a href="{% url 'work:task_file' f.pk %}?download=1" class="icon-btn" aria-label="{% translate 'Download' %}">{% icon "download" %}</a>{% endif %}
  <button type="button" class="icon-btn" data-remove-file="{{ f.pk }}" aria-label="{% blocktranslate with name=f.name %}Remove {{ name }}{% endblocktranslate %}">{% icon "trash" %}</button>
</li>
